[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-engineering-agents"
version = "1.0.0"
description = "L3 reference multi-agent system for API engineering release governance"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mahsa Keikha"}]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["AGENTS*", "SKILLS*", "TOOLS*", "orchestration*", "memory*", "observability*", "safety*", "schemas*", "state*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
